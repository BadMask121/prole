<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prole — Markup</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./editor.css" />
  </head>
  <body class="editor">
    <header class="toolbar" data-tauri-drag-region>
      <div class="tool-row" data-tauri-drag-region>
        <div class="segmented" id="tools" role="radiogroup" aria-label="Tool">
          <span class="seg-indicator" id="segIndicator" aria-hidden="true"></span>
          <button data-tool="rect" role="radio" title="Rectangle (R)" aria-label="Rectangle">
            <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2" /></svg>
          </button>
          <button data-tool="arrow" role="radio" title="Arrow (A)" aria-label="Arrow">
            <svg class="icon" viewBox="0 0 24 24"><path d="M5 19 19 5M10 5h9v9" /></svg>
          </button>
          <button data-tool="pen" role="radio" title="Pen (P)" aria-label="Pen">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 20c3-1 4.5-2.5 6-5l8.5-8.5a2.1 2.1 0 0 0-3-3L7 12c-2.5 1.5-4 3-3 8z" /></svg>
          </button>
          <button data-tool="text" role="radio" title="Text (T)" aria-label="Text">
            <svg class="icon" viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6" /></svg>
          </button>
        </div>

        <span class="divider" aria-hidden="true"></span>

        <div class="swatches" id="swatches" role="radiogroup" aria-label="Colour"></div>

        <div class="text-size" id="textProps" hidden>
          <span class="divider" aria-hidden="true"></span>
          <button class="icon-btn" id="sizeDown" title="Smaller" aria-label="Smaller text">
            <svg class="icon" viewBox="0 0 24 24"><path d="M7 12h10" /></svg>
          </button>
          <input id="sizeInput" class="size-input" type="number" min="8" max="240" step="4" aria-label="Text size" />
          <button class="icon-btn" id="sizeUp" title="Larger" aria-label="Larger text">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 7v10M7 12h10" /></svg>
          </button>
        </div>

        <span class="divider" aria-hidden="true"></span>

        <div class="history">
          <button class="icon-btn" id="undo" title="Undo (⌘Z)" aria-label="Undo">
            <svg class="icon" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
          </button>
          <button class="icon-btn" id="redo" title="Redo (⇧⌘Z)" aria-label="Redo">
            <svg class="icon" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5" /><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" /></svg>
          </button>
          <button class="icon-btn" id="clear" title="Clear all" aria-label="Clear all markup">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3" /></svg>
          </button>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-ghost" id="cancel" title="Discard (Esc)">Cancel</button>
        <button class="btn btn-primary copy" id="copy" data-state="idle" title="Copy image (⌘C)">
          <span class="copy-face" data-face="idle">
            <svg class="icon" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5" /><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5" /></svg>
            Copy
          </span>
          <span class="copy-face" data-face="done" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
            Copied
          </span>
        </button>
      </div>
    </header>

    <main id="stage" data-state="loading">
      <canvas id="canvas" data-tool="rect"></canvas>
      <div class="stage-msg" id="stageMsg" role="status"></div>
    </main>

    <footer class="statusbar">
      <span id="dims"></span>
      <span class="hints">
        <span><span class="kbd">R</span><span class="kbd">A</span><span class="kbd">P</span><span class="kbd">T</span> tools</span>
        <span><span class="kbd">⌘Z</span> undo</span>
        <span><span class="kbd">⌘C</span> copy</span>
        <span><span class="kbd">Esc</span> close</span>
      </span>
    </footer>

    <script type="module" src="./editor.ts"></script>
  </body>
</html>
